services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    # set 1000:1000 to run as the first user created on the system 
    user: 0:0
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /srv/nas/docker/jellyfin/config:/config
      - /srv/nas/docker/jellyfin/cache:/cache
      - /srv/nas/docker/jellyfin/fonts:/usr/local/share/fonts/custom
      - type: bind
        source: /srv/nas/media
        target: /media
      - type: bind
        source: /srv/toschestation
        target: /toschestation
    restart: 'unless-stopped'